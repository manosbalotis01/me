<!doctype html>
<html lang="el">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <link rel="icon" type="image/png" href="../assets/images/logo.png" />
  <link rel="apple-touch-icon" href="../assets/images/logo.png" />
  <title>Manos Balotis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" />
  <link rel="stylesheet" href="../assets/css/main.css" />
  <style>
    body{
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
    }
    .card-page{
      width: 100%;
      max-width: 360px;
      padding: var(--pad);
      display: grid;
      justify-items: center;
      gap: 40px;
      text-align: center;
    }
    .card-intro{
      display: grid;
      justify-items: center;
      gap: 14px;
    }
    .card-mark{
      font-size: clamp(40px, 12vw, 56px);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .card-tagline{
      margin: 0;
      font-style: italic;
      color: var(--muted);
      line-height: 1.55;
    }
    .card-links{
      display: grid;
      width: 100%;
      gap: 12px;
    }
    .card-links .btn{
      width: 100%;
      justify-content: center;
    }
    .card-socials{
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .card-socials .btn{
      padding: 12px;
    }
  </style>
</head>

<body>
  <div class="card-page">
    <div class="card-intro">
      <div class="card-mark">&gt;MB_</div>
      <p class="card-tagline">Ιστοσελίδες, QR μενού, e-shop,<br />ψηφιακή παρουσία στο διαδίκτυο</p>
    </div>

    <div class="card-links">
      <a class="btn primary" href="manos-balotis.vcf">
        Προσθήκη στις επαφές <span class="arrow" aria-hidden="true">→</span>
      </a>
      <a class="btn" href="https://manosbalotis.com" target="_blank" rel="noopener noreferrer">
        Επίσκεψη στο site
      </a>
      <a class="btn" href="tel:+306941509482">+30 694 150 9482</a>
      <a class="btn" href="mailto:contact@manosbalotis.com">contact@manosbalotis.com</a>

      <div class="card-socials">
        <a class="btn" href="https://www.instagram.com/manosbalotis_dev?igsh=MXdxbnR5ZmgydG1kNQ%3D%3D&amp;utm_source=qr"
          target="_blank" rel="noopener noreferrer" aria-label="Instagram">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <circle cx="17.4" cy="6.6" r="0.9" fill="currentColor" stroke="none"></circle>
          </svg>
        </a>
        <a class="btn" href="https://www.linkedin.com/in/manos-balotis-3b1b2b264" target="_blank"
          rel="noopener noreferrer" aria-label="LinkedIn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="3"></rect>
            <line x1="7.5" y1="10.3" x2="7.5" y2="17"></line>
            <circle cx="7.5" cy="6.8" r="0.9" fill="currentColor" stroke="none"></circle>
            <path d="M11 17v-4.3c0-1.7 1-2.7 2.4-2.7 1.3 0 2.1 1 2.1 2.6V17"></path>
            <line x1="11" y1="10.3" x2="11" y2="17"></line>
          </svg>
        </a>
      </div>
    </div>
  </div>
</body>

</html>
